name: Daily fetch & deploy

on:
  schedule:
    - cron: "17 6 * * *"  # daily at 06:17 UTC; offset to dodge the top-of-hour rush
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "drugs.yaml"
      - ".github/workflows/daily.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so build_site.py can compute diffs across versions.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest labels
        run: python scripts/fetch.py

      - name: Commit any updates
        id: commit
        run: |
          git config user.name "fda-label-watch-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No label changes today."
          else
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "snapshot: $DATE"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        run: python scripts/build_site.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
